<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ subject }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222; margin: 0; padding: 20px; background: #f6f8fb;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;">
    <tr>
      <td style="padding: 18px 24px; border-bottom: 1px solid #e2e8f0; background: #f8fafc;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td style="width: 44px; vertical-align: middle;">
              <img
                src="https://scanmybill.xyz/icons/icon-192.png"
                alt="ScanMyBill logo"
                width="36"
                height="36"
                style="display: block; border: 0; border-radius: 8px;"
              />
            </td>
            <td style="padding-left: 10px; vertical-align: middle;">
              <p style="margin: 0; font-size: 18px; font-weight: 700; color: #0f172a;">ScanMyBill</p>
              <p style="margin: 2px 0 0; font-size: 12px; color: #64748b;">AI Billing &amp; GST Workflows for Indian MSMEs</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding: 24px;">
        <h2 style="margin: 0 0 12px; font-size: 24px; color: #0f172a;">{{ subject }}</h2>
        <p style="margin: 0 0 16px; white-space: pre-line;">{{ message }}</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;" />
        <p style="margin: 0; font-size: 13px; color: #475569;">
          You received this email because you subscribed to ScanMyBill.
        </p>
        <p style="margin: 6px 0 0; font-size: 13px; color: #475569;">
          Unsubscribe:
          <a href="{{ unsubscribe_link }}" style="color: #2563eb; text-decoration: none;">{{ unsubscribe_link }}</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
