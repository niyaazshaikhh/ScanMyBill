name: Deploy ScanMyBill to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE_REPOSITORY: scanmybill-backend
  FRONTEND_IMAGE_REPOSITORY: scanmybill-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
      NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES || vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_latest: ${{ steps.images.outputs.backend_latest }}
      frontend_latest: ${{ steps.images.outputs.frontend_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required variables and secrets
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
          NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES || vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$ACR_NAME" || (echo "Missing GitHub variable: ACR_NAME" && exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "Missing GitHub variable: NEXT_PUBLIC_API_URL" && exit 1)
          test -n "$NEXT_PUBLIC_APP_URL" || (echo "Missing GitHub variable: NEXT_PUBLIC_APP_URL" && exit 1)
          test -n "$AZURE_CLIENT_ID" || (echo "Missing GitHub secret: AZURE_CLIENT_ID" && exit 1)
          test -n "$AZURE_TENANT_ID" || (echo "Missing GitHub secret: AZURE_TENANT_ID" && exit 1)
          test -n "$AZURE_SUBSCRIPTION_ID" || (echo "Missing GitHub secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          [[ "$NEXT_PUBLIC_APP_URL" =~ ^https://[^[:space:]]+$ ]] || (echo "NEXT_PUBLIC_APP_URL must be an HTTPS URL for production." && exit 1)
          [[ ! "$NEXT_PUBLIC_APP_URL" =~ localhost|127\.0\.0\.1 ]] || (echo "NEXT_PUBLIC_APP_URL cannot point to localhost in production." && exit 1)
          if [[ "$NEXT_PUBLIC_API_URL" == "/api/v1" ]]; then
            echo "NEXT_PUBLIC_API_URL uses same-domain reverse proxy mode (/api/v1)."
          elif [[ "$NEXT_PUBLIC_API_URL" =~ ^https://[^[:space:]]+/api/v1$ ]]; then
            echo "NEXT_PUBLIC_API_URL uses split-domain HTTPS mode."
          else
            echo "NEXT_PUBLIC_API_URL must be '/api/v1' or 'https://<api-host>/api/v1' for production."
            exit 1
          fi
          [[ ! "$NEXT_PUBLIC_API_URL" =~ localhost|127\.0\.0\.1 ]] || (echo "NEXT_PUBLIC_API_URL cannot point to localhost in production." && exit 1)
          [[ "$NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || (echo "NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES must be a positive integer." && exit 1)
          test "$NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES" -gt 0 || (echo "NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES must be > 0." && exit 1)
          if [[ -n "$NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES" ]]; then
            [[ "$NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || (echo "NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES must be a positive integer when set." && exit 1)
            test "$NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES" -gt 0 || (echo "NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES must be > 0 when set." && exit 1)
          fi

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App

      - name: Login to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${ACR_NAME}.azurecr.io"
          echo "backend_image=${REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES=${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
            NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES=${{ vars.NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES || vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    environment: production
    steps:
      - name: Validate deployment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPP_BACKEND_NAME: ${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}
          AZURE_CONTAINERAPP_FRONTEND_NAME: ${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || (echo "Missing GitHub variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "$AZURE_CONTAINERAPP_BACKEND_NAME" || (echo "Missing GitHub variable: AZURE_CONTAINERAPP_BACKEND_NAME" && exit 1)
          test -n "$AZURE_CONTAINERAPP_FRONTEND_NAME" || (echo "Missing GitHub variable: AZURE_CONTAINERAPP_FRONTEND_NAME" && exit 1)

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App

      - name: Sync backend container secrets (optional)
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPP_BACKEND_NAME: ${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          RAZORPAY_KEY_ID_SECRET: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          BACKEND_SECRETS=()
          [[ -n "${DATABASE_URL_OVERRIDE:-}" ]] && BACKEND_SECRETS+=("database-url-override=${DATABASE_URL_OVERRIDE}")
          [[ -n "${SECRET_KEY:-}" ]] && BACKEND_SECRETS+=("secret-key=${SECRET_KEY}")
          [[ -n "${OPENAI_API_KEY:-}" ]] && BACKEND_SECRETS+=("openai-api-key=${OPENAI_API_KEY}")
          [[ -n "${AZURE_OPENAI_API_KEY:-}" ]] && BACKEND_SECRETS+=("azure-openai-api-key=${AZURE_OPENAI_API_KEY}")
          [[ -n "${RAZORPAY_KEY_ID_SECRET:-}" ]] && BACKEND_SECRETS+=("razorpay-key-id=${RAZORPAY_KEY_ID_SECRET}")
          [[ -n "${RAZORPAY_KEY_SECRET:-}" ]] && BACKEND_SECRETS+=("razorpay-key-secret=${RAZORPAY_KEY_SECRET}")
          [[ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]] && BACKEND_SECRETS+=("razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET}")
          [[ -n "${SMTP_PASSWORD:-}" ]] && BACKEND_SECRETS+=("smtp-password=${SMTP_PASSWORD}")

          if [[ "${#BACKEND_SECRETS[@]}" -eq 0 ]]; then
            echo "No backend secret overrides found in GitHub secrets; skipping container secret sync."
            exit 0
          fi

          az containerapp secret set \
            --name "$AZURE_CONTAINERAPP_BACKEND_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${BACKEND_SECRETS[@]}"

      - name: Sync backend runtime environment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPP_BACKEND_NAME: ${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
          API_V1_PREFIX: ${{ vars.API_V1_PREFIX || '/api/v1' }}
          PORT: ${{ vars.BACKEND_INTERNAL_PORT || '8000' }}
          DEBUG: ${{ vars.DEBUG || 'false' }}
          ENABLE_DOCS: ${{ vars.ENABLE_DOCS || 'false' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          TRUST_PROXY_HEADERS: ${{ vars.TRUST_PROXY_HEADERS || 'true' }}
          ENFORCE_HTTPS: ${{ vars.ENFORCE_HTTPS || 'true' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || vars.NEXT_PUBLIC_APP_URL }}
          TRUSTED_HOSTS: ${{ vars.TRUSTED_HOSTS }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'true' }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE || 'lax' }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          EXPOSE_PASSWORD_RESET_TOKEN: ${{ vars.EXPOSE_PASSWORD_RESET_TOKEN || 'false' }}
          SEED_DEFAULT_ADMIN: ${{ vars.SEED_DEFAULT_ADMIN || 'false' }}
          UPLOADS_DIR: ${{ vars.UPLOADS_DIR || 'uploads' }}
          FRONTEND_RESET_PASSWORD_URL: ${{ vars.FRONTEND_RESET_PASSWORD_URL || 'https://app.scanmybill.xyz/reset-password' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-12-01-preview' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          RAZORPAY_PLAN_ID: ${{ vars.RAZORPAY_PLAN_ID }}
          RAZORPAY_PLAN_IDS: ${{ vars.RAZORPAY_PLAN_IDS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_EMAIL: ${{ vars.SMTP_EMAIL }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_SENDER_EMAIL: ${{ vars.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME || 'ScanMyBill' }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS || 'true' }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          RAZORPAY_KEY_ID_SECRET: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          BACKEND_ENV_VARS=(
            "ENVIRONMENT=${ENVIRONMENT}"
            "API_V1_PREFIX=${API_V1_PREFIX}"
            "PORT=${PORT}"
            "DEBUG=${DEBUG}"
            "ENABLE_DOCS=${ENABLE_DOCS}"
            "LOG_LEVEL=${LOG_LEVEL}"
            "TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS}"
            "ENFORCE_HTTPS=${ENFORCE_HTTPS}"
            "COOKIE_SECURE=${COOKIE_SECURE}"
            "COOKIE_SAMESITE=${COOKIE_SAMESITE}"
            "EXPOSE_PASSWORD_RESET_TOKEN=${EXPOSE_PASSWORD_RESET_TOKEN}"
            "SEED_DEFAULT_ADMIN=${SEED_DEFAULT_ADMIN}"
            "UPLOADS_DIR=${UPLOADS_DIR}"
            "FRONTEND_RESET_PASSWORD_URL=${FRONTEND_RESET_PASSWORD_URL}"
            "OPENAI_MODEL=${OPENAI_MODEL}"
            "AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}"
            "SMTP_PORT=${SMTP_PORT}"
            "SMTP_SENDER_NAME=${SMTP_SENDER_NAME}"
            "SMTP_USE_TLS=${SMTP_USE_TLS}"
          )

          if [[ -n "${CORS_ORIGINS:-}" ]]; then
            BACKEND_ENV_VARS+=("CORS_ORIGINS=${CORS_ORIGINS}")
          elif [[ -n "${NEXT_PUBLIC_APP_URL:-}" ]]; then
            BACKEND_ENV_VARS+=("CORS_ORIGINS=${NEXT_PUBLIC_APP_URL}")
          fi

          [[ -n "${TRUSTED_HOSTS:-}" ]] && BACKEND_ENV_VARS+=("TRUSTED_HOSTS=${TRUSTED_HOSTS}")
          [[ -n "${COOKIE_DOMAIN:-}" ]] && BACKEND_ENV_VARS+=("COOKIE_DOMAIN=${COOKIE_DOMAIN}")
          [[ -n "${OPENAI_BASE_URL:-}" ]] && BACKEND_ENV_VARS+=("OPENAI_BASE_URL=${OPENAI_BASE_URL}")
          [[ -n "${AZURE_OPENAI_ENDPOINT:-}" ]] && BACKEND_ENV_VARS+=("AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}")
          [[ -n "${AZURE_OPENAI_DEPLOYMENT:-}" ]] && BACKEND_ENV_VARS+=("AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}")
          [[ -n "${GOOGLE_CLIENT_ID:-}" ]] && BACKEND_ENV_VARS+=("GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}")
          [[ -n "${GOOGLE_CLIENT_IDS:-}" ]] && BACKEND_ENV_VARS+=("GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}")
          [[ -n "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}" ]] && BACKEND_ENV_VARS+=("NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}")
          [[ -n "${RAZORPAY_PLAN_ID:-}" ]] && BACKEND_ENV_VARS+=("RAZORPAY_PLAN_ID=${RAZORPAY_PLAN_ID}")
          [[ -n "${RAZORPAY_PLAN_IDS:-}" ]] && BACKEND_ENV_VARS+=("RAZORPAY_PLAN_IDS=${RAZORPAY_PLAN_IDS}")
          [[ -n "${SMTP_HOST:-}" ]] && BACKEND_ENV_VARS+=("SMTP_HOST=${SMTP_HOST}")
          [[ -n "${SMTP_EMAIL:-}" ]] && BACKEND_ENV_VARS+=("SMTP_EMAIL=${SMTP_EMAIL}")
          [[ -n "${SMTP_USERNAME:-}" ]] && BACKEND_ENV_VARS+=("SMTP_USERNAME=${SMTP_USERNAME}")
          [[ -n "${SMTP_SENDER_EMAIL:-}" ]] && BACKEND_ENV_VARS+=("SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL}")

          [[ -n "${DATABASE_URL_OVERRIDE:-}" ]] && BACKEND_ENV_VARS+=("DATABASE_URL_OVERRIDE=secretref:database-url-override")
          [[ -n "${SECRET_KEY:-}" ]] && BACKEND_ENV_VARS+=("SECRET_KEY=secretref:secret-key")
          [[ -n "${OPENAI_API_KEY:-}" ]] && BACKEND_ENV_VARS+=("OPENAI_API_KEY=secretref:openai-api-key")
          [[ -n "${AZURE_OPENAI_API_KEY:-}" ]] && BACKEND_ENV_VARS+=("AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key")
          [[ -n "${RAZORPAY_KEY_ID_SECRET:-}" ]] && BACKEND_ENV_VARS+=("RAZORPAY_KEY_ID=secretref:razorpay-key-id")
          [[ -n "${RAZORPAY_KEY_SECRET:-}" ]] && BACKEND_ENV_VARS+=("RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret")
          [[ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]] && BACKEND_ENV_VARS+=("RAZORPAY_WEBHOOK_SECRET=secretref:razorpay-webhook-secret")
          [[ -n "${SMTP_PASSWORD:-}" ]] && BACKEND_ENV_VARS+=("SMTP_PASSWORD=secretref:smtp-password")

          az containerapp update \
            --name "$AZURE_CONTAINERAPP_BACKEND_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "${BACKEND_ENV_VARS[@]}"

      - name: Sync frontend runtime environment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPP_FRONTEND_NAME: ${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
          NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES || vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          FRONTEND_PORT: ${{ vars.FRONTEND_INTERNAL_PORT || '3000' }}
        run: |
          set -euo pipefail
          FRONTEND_ENV_VARS=(
            "NODE_ENV=production"
            "PORT=${FRONTEND_PORT}"
            "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}"
            "NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES=${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES}"
            "NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES=${NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES}"
          )
          [[ -n "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}" ]] && FRONTEND_ENV_VARS+=("NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}")
          [[ -n "${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}" ]] && FRONTEND_ENV_VARS+=("NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}")

          az containerapp update \
            --name "$AZURE_CONTAINERAPP_FRONTEND_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "${FRONTEND_ENV_VARS[@]}"

      - name: Deploy backend image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.backend_image }}"

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.frontend_image }}"

      - name: Smoke check deployed health endpoints
        run: |
          BACKEND_FQDN="$(az containerapp show --name "${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          FRONTEND_FQDN="$(az containerapp show --name "${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$BACKEND_FQDN" || (echo "Backend FQDN not found" && exit 1)
          test -n "$FRONTEND_FQDN" || (echo "Frontend FQDN not found" && exit 1)
          curl -fsS "https://${BACKEND_FQDN}/health/live" >/dev/null
          curl -fsS "https://${FRONTEND_FQDN}/" >/dev/null
