name: Deploy ScanMyBill to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE_REPOSITORY: scanmybill-backend
  FRONTEND_IMAGE_REPOSITORY: scanmybill-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_latest: ${{ steps.images.outputs.backend_latest }}
      frontend_latest: ${{ steps.images.outputs.frontend_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required variables and secrets
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$ACR_NAME" || (echo "Missing GitHub variable: ACR_NAME" && exit 1)
          test -n "$NEXT_PUBLIC_API_URL" || (echo "Missing GitHub variable: NEXT_PUBLIC_API_URL" && exit 1)
          test -n "$NEXT_PUBLIC_APP_URL" || (echo "Missing GitHub variable: NEXT_PUBLIC_APP_URL" && exit 1)
          test -n "$AZURE_CLIENT_ID" || (echo "Missing GitHub secret: AZURE_CLIENT_ID" && exit 1)
          test -n "$AZURE_TENANT_ID" || (echo "Missing GitHub secret: AZURE_TENANT_ID" && exit 1)
          test -n "$AZURE_SUBSCRIPTION_ID" || (echo "Missing GitHub secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          [[ "$NEXT_PUBLIC_APP_URL" =~ ^https://[^[:space:]]+$ ]] || (echo "NEXT_PUBLIC_APP_URL must be an HTTPS URL for production." && exit 1)
          [[ ! "$NEXT_PUBLIC_APP_URL" =~ localhost|127\.0\.0\.1 ]] || (echo "NEXT_PUBLIC_APP_URL cannot point to localhost in production." && exit 1)
          if [[ "$NEXT_PUBLIC_API_URL" == "/api/v1" ]]; then
            echo "NEXT_PUBLIC_API_URL uses same-domain reverse proxy mode (/api/v1)."
          elif [[ "$NEXT_PUBLIC_API_URL" =~ ^https://[^[:space:]]+/api/v1$ ]]; then
            echo "NEXT_PUBLIC_API_URL uses split-domain HTTPS mode."
          else
            echo "NEXT_PUBLIC_API_URL must be '/api/v1' or 'https://<api-host>/api/v1' for production."
            exit 1
          fi
          [[ ! "$NEXT_PUBLIC_API_URL" =~ localhost|127\.0\.0\.1 ]] || (echo "NEXT_PUBLIC_API_URL cannot point to localhost in production." && exit 1)

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App

      - name: Login to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${ACR_NAME}.azurecr.io"
          echo "backend_image=${REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES=${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    environment: production
    steps:
      - name: Validate deployment variables
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPP_BACKEND_NAME: ${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}
          AZURE_CONTAINERAPP_FRONTEND_NAME: ${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || (echo "Missing GitHub variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "$AZURE_CONTAINERAPP_BACKEND_NAME" || (echo "Missing GitHub variable: AZURE_CONTAINERAPP_BACKEND_NAME" && exit 1)
          test -n "$AZURE_CONTAINERAPP_FRONTEND_NAME" || (echo "Missing GitHub variable: AZURE_CONTAINERAPP_FRONTEND_NAME" && exit 1)

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App

      - name: Deploy backend image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.backend_image }}"

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.frontend_image }}"

      - name: Smoke check deployed health endpoints
        run: |
          BACKEND_FQDN="$(az containerapp show --name "${{ vars.AZURE_CONTAINERAPP_BACKEND_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          FRONTEND_FQDN="$(az containerapp show --name "${{ vars.AZURE_CONTAINERAPP_FRONTEND_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$BACKEND_FQDN" || (echo "Backend FQDN not found" && exit 1)
          test -n "$FRONTEND_FQDN" || (echo "Frontend FQDN not found" && exit 1)
          curl -fsS "https://${BACKEND_FQDN}/health/live" >/dev/null
          curl -fsS "https://${FRONTEND_FQDN}/" >/dev/null
