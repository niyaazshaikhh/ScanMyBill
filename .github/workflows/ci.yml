name: ScanMyBill CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      ENABLE_DOCS: "true"
      EXPOSE_PASSWORD_RESET_TOKEN: "false"
      SEED_DEFAULT_ADMIN: "false"
      SECRET_KEY: ci-local-secret-key-change-before-production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend sources
        run: python -m compileall backend/app

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
      NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${{ vars.NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES || vars.NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES || '30' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t scanmybill/backend:ci-${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: docker build -t scanmybill/frontend:ci-${{ github.sha }} ./frontend
