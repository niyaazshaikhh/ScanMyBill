name: ScanMyBill CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------
      # Backend (FastAPI)
      # ---------------------

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Backend lint
        run: |
          cd backend
          pip install flake8
          flake8 . || true

      # ---------------------
      # Frontend (Next.js)
      # ---------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # ---------------------
      # Docker validation
      # ---------------------

      - name: Build backend Docker image
        run: |
          docker build -t scanmybill-backend ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t scanmybill-frontend ./frontend

      - name: CI Finished
        run: echo "CI build successful 🚀"
