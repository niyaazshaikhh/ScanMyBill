services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-scanmybill/backend:latest}
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      PORT: ${BACKEND_INTERNAL_PORT:-8000}
      DATABASE_URL_OVERRIDE: ${DATABASE_URL_OVERRIDE:?Set DATABASE_URL_OVERRIDE for managed cloud DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your frontend URL(s)}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to your backend hostnames}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-true}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-false}
      EXPOSE_PASSWORD_RESET_TOKEN: ${EXPOSE_PASSWORD_RESET_TOKEN:-false}
      UPLOADS_DIR: ${UPLOADS_DIR:-uploads}
    ports:
      - '${BACKEND_PORT:-8000}:${BACKEND_INTERNAL_PORT:-8000}'
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; port=os.getenv('PORT','8000'); req=urllib.request.Request(f'http://127.0.0.1:{port}/health/live', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - scanmybill

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES:-30}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    image: ${FRONTEND_IMAGE:-scanmybill/frontend:latest}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_INTERNAL_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES:-30}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    ports:
      - '${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-3000}'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider "http://127.0.0.1:${FRONTEND_INTERNAL_PORT:-3000}/" || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - scanmybill

volumes:
  backend_uploads:

networks:
  scanmybill:
    driver: bridge
